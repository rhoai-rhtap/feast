---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/feast?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "group-test"
    pipelinesascode.tekton.dev/on-comment: "^/group-test"
  name: odh-group-test-feast
  namespace: open-data-hub-tenant
  labels:
    appstudio.openshift.io/application: poc
    appstudio.openshift.io/component: feast-group-poc
    pipelines.appstudio.openshift.io/type: build
spec:
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: konflux-poc
    - name: pathInRepo
      value: integration-tests/template/pr-group-testing-pipeline.yaml