---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/feast?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "group-test"
    pipelinesascode.tekton.dev/on-comment: "^/group-test"
  name: odh-group-test-feast
  namespace: open-data-hub-tenant
  labels:
    appstudio.openshift.io/application: poc
    appstudio.openshift.io/component: feast-group-poc
    pipelines.appstudio.openshift.io/type: test
spec:
  params:
  - name: group-components
    value: '{ "feast-operator-poc": "redhat-user-workloads/open-data-hub-tenant/feast-operator-poc", "feature-server-poc": "redhat-user-workloads/open-data-hub-tenant/feature-server-poc" }'
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: konflux-poc
    - name: pathInRepo
      value: integration-tests/feast/pr-group-testing-pipeline.yaml
  taskRunTemplate:
    podTemplate:
      nodeSelector:
        konflux-ci.dev/workload: konflux-tenants
      tolerations:
      - effect: NoSchedule
        key: konflux-ci.dev/workload
        operator: Equal
        value: konflux-tenants
    serviceAccountName: konflux-integration-runner
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'